openapi: 3.0.3
info:
  title: semochal API 기능 명세서
  version: 0.0.1
  description: |
    챌린지(공모전) 매칭 플랫폼 semochal의 기능 명세서.

    - **사용자 영역**: 홈/탐색, 팀 모집, 챌린지 지원, 마이페이지(북마크·관심분야·알림·프로필)
    - **기업 영역(SEMO.BIZ)**: 기관 가입/인증, 공고(챌린지) 관리, 지원서 관리, 광고/결제, 운영대행 문의
    - **관리자 영역**: 기관 심사, 인증 관리, 광고 관리/광고비, 사용자 관리, 신고 처리, 리포트, 설정

    구현 상태 표기:
    - `implemented` — `server/src/modules`의 컨트롤러에 실제 구현된 엔드포인트
    - `planned` — 프론트 화면(`front/src/app`)에서 사용되지만 아직 백엔드 미구현(목업 데이터 기반)

    인증 방식: 로그인 시 설정되는 HttpOnly 세션 쿠키의 JWT를 사용한다.
servers:
  - url: http://localhost:3001
    description: 로컬 개발 서버
tags:
  - name: Health
    description: 인프라 헬스체크
  - name: Auth
    description: 로그인/인증 (사용자·기업 공통)
  - name: Users
    description: 사용자 프로필/온보 설문
  - name: Challenges
    description: 챌린지(공모전) 탐색·등록
  - name: Teams
    description: 팀 모집글
  - name: Applications
    description: 챌린지/팀 지원서
  - name: Bookmarks
    description: 챌린지 북마크(스크랩)
  - name: Interests
    description: 관심분야·알림 설정
  - name: Notifications
    description: 알림 조회
  - name: Reports
    description: 신고 접수(챌린지/팀 모집글/사용자 프로필)
  - name: Businesses
    description: 기업(기관) 등록/조회
  - name: Verifications
    description: 기관 인증(사업자등록증 OCR 심사)
  - name: Ads
    description: 광고 상품·노출·리포트
  - name: Orders
    description: 주문
  - name: Payments
    description: 결제(토스 웹훅)
  - name: Billing
    description: 결제수단·결제 내역
  - name: Operations
    description: 운영대행 문의
  - name: Files
    description: 파일 업로드(Presigned URL)
  - name: Admin
    description: 관리자(대시보드·심사·사용자·신고·분석·설정)

paths:
  # ---------------------------------------------------------------- Health
  /health:
    get:
      tags: [Health]
      summary: 헬스체크
      operationId: checkHealth
      x-impl-status: implemented
      description: DB에 `select 1`을 실행해 연결을 확인한다. DB에 닿지 못하면 503(ALB 타깃그룹이 인스턴스를 unhealthy로 판단).
      responses:
        '200':
          description: 서비스 정상 (DB 연결 확인됨)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  timestamp: { type: string, format: date-time }
        '503':
          description: DB에 연결할 수 없음
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: error }
                  timestamp: { type: string, format: date-time }

  # ---------------------------------------------------------------- Auth
  /auth/register:
    post:
      tags: [Auth]
      summary: 이메일 회원가입
      operationId: register
      x-impl-status: implemented
      description: |
        이메일/비밀번호로 계정을 생성한다. **원래 명세에는 없던 엔드포인트** — 실제 운영 화면은
        소셜 로그인(`/auth/social/{provider}`, 아직 planned)이 기본 가입 경로이지만, 그 경로가
        구현되기 전까지 `/auth/login`을 실제로 발급/검증 가능하게 만들기 위해 추가했다.
        bcrypt로 해시한 비밀번호를 저장하고 가입 즉시 HttpOnly 세션 쿠키를 설정한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, name]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                name: { type: string }
                # 기업 회원가입(`/biz/login`) 추가 필드 — 모두 선택
                username:
                  type: string
                  pattern: '^[a-z0-9_]{4,20}$'
                  description: 로그인 아이디 (이메일 대신 로그인 가능)
                phone: { type: string, maxLength: 30, description: 휴대폰 번호 }
                emailVerificationId:
                  type: string
                  format: uuid
                  description: 확인 완료된 이메일 인증 ID (`/auth/contact-verifications`)
                phoneVerificationId:
                  type: string
                  format: uuid
                  description: 확인 완료된 휴대폰 인증 ID
                agreements:
                  type: array
                  items: { type: string, enum: [privacy, business] }
                  description: 동의한 약관 키 (동의 시각과 함께 저장)
      responses:
        '201':
          description: 가입 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/User' }
        '400':
          description: 인증 ID가 확인되지 않았거나 만료/재사용됨
        '409':
          description: 이미 가입된 이메일 또는 아이디
  /auth/contact-verifications:
    post:
      tags: [Auth]
      summary: 이메일/휴대폰 인증번호 요청
      operationId: requestContactVerification
      x-impl-status: implemented
      description: |
        6자리 인증번호(5분 유효)를 만들고 발송 이벤트를 outbox에 적재한다. 같은 대상은 60초에 1회.
        발송 relay(SES/SMS)는 아직 없어 production에서는 503을 반환하고, 그 외 환경에서는
        테스트용으로 `devCode`를 함께 돌려준다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel, target]
              properties:
                channel: { type: string, enum: [email, phone] }
                target: { type: string, maxLength: 255 }
      responses:
        '201':
          description: 인증 요청 생성
          content:
            application/json:
              schema:
                type: object
                required: [id, expiresAt]
                properties:
                  id: { type: string, format: uuid }
                  expiresAt: { type: string, format: date-time }
                  devCode: { type: string, description: production 외 환경에서만 포함 }
        '429':
          description: 60초 내 재요청
        '503':
          description: 발송 수단 미구성
  /auth/contact-verifications/{id}/confirm:
    post:
      tags: [Auth]
      summary: 이메일/휴대폰 인증번호 확인
      operationId: confirmContactVerification
      x-impl-status: implemented
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, pattern: '^\d{6}$' }
      responses:
        '200':
          description: 인증 완료
          content:
            application/json:
              schema:
                type: object
                required: [id, verified]
                properties:
                  id: { type: string, format: uuid }
                  verified: { type: boolean }
        '400':
          description: 불일치/만료/시도 초과
  /auth/login:
    post:
      tags: [Auth]
      summary: 이메일 로그인
      operationId: login
      x-impl-status: implemented
      description: |
        이메일(또는 기업 계정의 아이디)/비밀번호로 로그인하여 HttpOnly 세션 쿠키(JWT, 7일 유효)를 설정한다.
        bcrypt로 저장된 해시와 비교하며, 일치하지 않으면 401을 반환한다.
        실제 운영 화면은 소셜 로그인(카카오/구글/네이버)이 기본이며, `/onboarding/*` 4단계 설문 후 가입 완료.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              description: email 또는 username 중 하나는 필수
              properties:
                email: { type: string, format: email }
                username: { type: string, maxLength: 50 }
                password: { type: string, minLength: 8 }
      responses:
        '200':
          description: 로그인 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/User' }
        '401':
          description: 인증 실패 (이메일 없음 또는 비밀번호 불일치)
  /auth/me:
    get:
      tags: [Auth]
      summary: 내 인증 정보 조회
      operationId: getMyAuthInfo
      x-impl-status: implemented
      description: HttpOnly 세션 쿠키의 JWT를 검증해 현재 로그인 사용자를 조회한다.
      responses:
        '200':
          description: 현재 사용자 정보
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/logout:
    post:
      tags: [Auth]
      summary: 로그아웃
      operationId: logout
      x-impl-status: implemented
      description: HttpOnly 세션 쿠키를 만료시킨다.
      responses:
        '204': { description: 로그아웃 성공 }
  /auth/social/{provider}:
    post:
      tags: [Auth]
      summary: 소셜 로그인 (카카오/구글/네이버)
      operationId: socialLogin
      x-impl-status: planned
      description: |
        프론트 로그인 화면(`/(auth)/login`)의 소셜 로그인 버튼용.
        OAuth 콜백 코드를 교환하여 토큰 발급 + 신규 사용자는 온보(`/onboarding/activity` → `/onboarding/challenge`)으로 진입.
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string, enum: [kakao, google, naver] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, description: OAuth 인가 코드 }
                redirectUri: { type: string }
      responses:
        '200':
          description: 로그인 성공 (신규 가입자는 isNewUser=true)
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken: { type: string }
                  isNewUser: { type: boolean }
                  user: { $ref: '#/components/schemas/User' }

  # ---------------------------------------------------------------- Users
  /users/{id}:
    get:
      tags: [Users]
      summary: 사용자 조회
      operationId: getUser
      x-impl-status: implemented
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 사용자 정보 (공개 프로필 `/profile` 화면의 Identity/뱃지/기술스택/수상이력 표시용)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '404': { $ref: '#/components/responses/NotFound' }
  /users/me:
    patch:
      tags: [Users]
      summary: 내 프로필 수정
      operationId: updateMyProfile
      x-impl-status: implemented
      description: |
        마이페이지(`/my`) 프로필 편집용. 기술 스택 추가, 자격증/뱃지 인증 요청, 외부 링크 관리.
        공개 프로필(`/profile`)에 노출되는 Identity(이름/역할/지역), 출품·수상 이력 포함.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                role: { type: string, description: 포지션 (기획/디자인/개발 등) }
                region: { type: string }
                stacks: { type: array, items: { type: string } }
                externalLinks: { type: array, items: { $ref: '#/components/schemas/ExternalLink' } }
                awardHistory: { type: array, items: { $ref: '#/components/schemas/AwardRecord' } }
      responses:
        '200':
          description: 수정된 사용자 정보
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
  /users/me/survey:
    put:
      tags: [Users]
      summary: 온보 설문 저장 (4단계)
      operationId: saveOnboardingSurvey
      x-impl-status: implemented
      description: |
        가입 후 4단계 설문: 활동 여부 → 관심 분야 Chip → 목적 Chip → 도전 유형 Chip.
        프론트는 `useUserStore`(zustand persist)에 저장, 홈의 AI 추천 챌린지 개인화에 사용.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OnboardingSurvey' }
      responses:
        '200':
          description: 저장 완료
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OnboardingSurvey' }

  # ---------------------------------------------------------------- Challenges
  /challenges:
    get:
      tags: [Challenges]
      summary: 챌린지 목록 조회 (커서 페이지네이션)
      operationId: listChallenges
      x-impl-status: implemented
      description: |
        생성일 내림차순 키셋 페이지네이션. 탐색 화면(`/explore`)의 필터(분야/대상/주최기관/상금 범위),
        정렬(마감임박/최신/인기), 검색어, "마감된 챌린지 포함"은 쿼리 확장으로 지원 예정.
      parameters:
        - name: cursor
          in: query
          schema: { type: string, format: date-time }
          description: 이전 페이지의 nextCursor (ISO 8601)
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: 챌린지 페이지
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Challenge' } }
                  nextCursor:
                    { type: string, nullable: true, description: 다음 페이지 커서 (없으면 null) }
    post:
      tags: [Challenges]
      summary: 챌린지 등록 (기업)
      operationId: createChallenge
      x-impl-status: implemented
      description: |
        기업 공고 등록(`/biz/postings/new`). 포스터 업로드는 `POST /files/presign` 선행,
        모집 역할·해시태그·신청폼(질문 유형 6가지)은 향후 스키마 확장 예정.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateChallengeRequest' }
      responses:
        '201':
          description: 등록된 챌린지 (status=draft)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Challenge' }
  /challenges/recommended:
    get:
      tags: [Challenges]
      summary: 관심사 기반 추천 챌린지 조회
      operationId: listRecommendedChallenges
      x-impl-status: implemented
      description: |
        로그인 사용자의 저장 관심사와 온보딩 설문 관심사를 병합해 published·미종료 챌린지를
        결정론적으로 정렬한다. 관심사가 없으면 인기와 최신순으로 fallback한다.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 6, minimum: 1, maximum: 20 }
      responses:
        '200':
          description: 추천 챌린지 목록
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Challenge' } }
  /challenges/{id}:
    get:
      tags: [Challenges]
      summary: 챌린지 상세 조회
      operationId: getChallenge
      x-impl-status: implemented
      description: |
        상세 화면(`/contests/{id}`): 정보 탭(주최/자격/접수기간/D-day/포스터/상세/요약)과
        팀모집 탭(연결된 팀 모집글), 유사 챌린지 3개, 북마크/공유(클립보드) 포함.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 챌린지 상세
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Challenge' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Challenges]
      summary: 챌린지(공고) 내용 수정 (기업)
      operationId: updateChallenge
      x-impl-status: implemented
      description: |
        공고 수정(`/biz/postings/{id}/edit`). 소유 비즈니스 또는 admin만 가능하며 권한이 없으면 404.
        보낸 필드만 부분 수정하고, 상태 변경은 `PATCH /challenges/{id}/status`를 쓴다.
        종료일이 시작일보다 빠르거나 수정할 필드가 없으면 400. 모집 중 공고의 수정 제한 정책은 미확정.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateChallengeRequest' }
      responses:
        '200':
          description: 수정된 챌린지
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Challenge' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /challenges/{id}/stats:
    get:
      tags: [Challenges]
      summary: 챌린지 통계 (클릭수·북마크·노출·지원자 분포·월별 노출 추이)
      operationId: getChallengeStats
      x-impl-status: implemented
      description: |
        기업 공고 관리(`/biz/postings/{id}`, `/biz/postings`)의 그래프 데이터를 한 번에 반환한다.
        - `clicks` / `bookmarks`: 사이드 StatBox (값 + 전주 대비 증감) — 상세 조회(`GET /challenges/{id}`)
          호출과 북마크 테이블에서 실집계.
        - `applicantDistribution`: 지원자 분포 파이차트 (conic-gradient, label + 백분율) — `applications.role`
          기준 실집계.
        - `monthlyExposure`: 공고 노출수 영역차트 (SVG area chart) 겸 월별 바차트 — 라벨('7월') + 값 배열
        - **주의**: 카드 노출(임프레션) 전용 계측 비콘이 아직 없어 `exposure`는 현재 `clicks`(상세 진입)와
          동일한 신호를 재사용한다. 카드 노출과 클릭을 분리하려면 프론트에 별도 임프레션 비콘 호출이 필요하다.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 통계 데이터
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChallengeStats' }
  /challenges/{id}/similar:
    get:
      tags: [Challenges]
      summary: 유사 챌린지 조회
      operationId: listSimilarChallenges
      x-impl-status: implemented
      description: 챌린지 상세 하단의 유사 챌린지 3개 추천.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 유사 챌린지 목록
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Challenge' } }

  # ---------------------------------------------------------------- Teams
  /teams:
    get:
      tags: [Teams]
      summary: 팀 모집글 목록 조회
      operationId: listTeams
      x-impl-status: implemented
      description: |
        팀 탐색 화면(`/teams`). 필터: 챌린지/필요역할/지역, "팀 찾기" 검색.
        홈(`/`)의 팀 모집 섹션, 챌린지 상세 팀모집 탭에서도 사용.
      parameters:
        - name: challengeId
          in: query
          schema: { type: string, format: uuid }
        - name: role
          in: query
          schema: { type: string, description: 필요 역할 (기획/디자인/개발 등) }
        - name: region
          in: query
          schema: { type: string }
        - name: q
          in: query
          schema: { type: string }
      responses:
        '200':
          description: 팀 모집글 목록
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Team' } }
    post:
      tags: [Teams]
      summary: 팀 모집글 작성
      operationId: createTeam
      x-impl-status: implemented
      description: |
        모집글 작성(`/teams/new`): 챌린지 선택 → 팀 소개 → 필요 역할 슬롯(추가/삭제) → 내 역할 → 우대사항 → 기타.
        프론트는 `useUserStore.recruitment`에 초안 저장 후 게시 시 토스트 + 작성된 모집글(`/teams/{id}`)로 이동.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTeamRequest' }
      responses:
        '201':
          description: 작성된 모집글
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Team' }
  /teams/{id}:
    get:
      tags: [Teams]
      summary: 팀 모집글 상세 조회
      operationId: getTeam
      x-impl-status: implemented
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 팀 모집글 상세
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Team' }
        '404': { $ref: '#/components/responses/NotFound' }
  /teams/{id}/join:
    post:
      tags: [Teams]
      summary: 팀 합류 신청
      operationId: joinTeam
      x-impl-status: implemented
      description: |
        팀 모집글 상세(`/teams/{id}`)의 "팀 신청하기". 로그인 필요 — 비로그인이면 프론트가 `/login?next=`로 보낸다.
        `pending` 팀원으로 등록되고 팀장에게 `team_matching` 알림이 간다. 팀장 본인/중복 신청은 400.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JoinTeamRequest' }
      responses:
        '201':
          description: 등록된 합류 신청
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamMember' }
        '400': { description: 팀장 본인 또는 중복 신청 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- Applications
  /applications:
    post:
      tags: [Applications]
      summary: 챌린지 참가 신청
      operationId: applyChallenge
      x-impl-status: implemented
      description: |
        지원서 작성 화면(`/applications/new`): 역할 선택, 팀원 구성(이름 입력/추가/삭제), 임시저장 후 제출.
        지원서 본문(역할/팀원)과 신청폼 응답(기업이 만든 구글폼 스타일 질문)은 향후 스키마 확장 예정.
      parameters:
        - name: x-user-id
          in: header
          schema: { type: string, format: uuid }
          description: 인증 가드 도입 전 임시 사용자 식별 (TODO)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApplyChallengeRequest' }
      responses:
        '201':
          description: 생성된 신청 (status=pending)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Application'
                  - type: object
                    properties:
                      order:
                        type: object
                        nullable: true
                        description: 유료 챌린지(price > 0)의 pending 주문 — 토스 결제 요청(orderId·amount)과 orderName 표시(name)에 사용. 무료 챌린지는 null.
                        properties:
                          id: { type: string, format: uuid }
                          amount: { type: integer }
                          name: { type: string, description: 챌린지 제목 (토스 orderName) }
  /applications/me:
    get:
      tags: [Applications]
      summary: 내 지원 현황 조회
      operationId: listMyApplications
      x-impl-status: implemented
      description: |
        마이페이지 지원현황(`/my/applications`): 챌린지 지원(결과 태그: 예선통과/심사중/탈락)과
        팀 지원현황(확정/검토중/거절) 두 테이블. 팀 지원은 향후 별도 확장.
      parameters:
        - name: x-user-id
          in: header
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 내 신청 목록
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Application' } }
  /applications/{id}:
    get:
      tags: [Applications]
      summary: 지원서 상세 조회
      operationId: getApplication
      x-impl-status: implemented
      description: 기업 지원서 관리(`/biz/applications`)의 행 클릭 상세.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 지원서 상세 (신청자/팀/상태/담당자 메모/평가상태)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Application' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Applications]
      summary: 지원서 상태 변경 (검토중/보완요청/합격/불합격 + 담당자 메모)
      operationId: updateApplication
      x-impl-status: implemented
      description: |
        기업 지원서 관리 화면의 상태 Dropdown(제출완료/검토중/보완요청), 평가상태(미정/합격/불합격),
        담당자 메모 입력, 납볍하기(엑셀 export). 팀 지원 결과 전송(채팅방 링크)도 이 흐름의 확장.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  { type: string, enum: [submitted, reviewing, needs_revision, accepted, rejected] }
                evaluation: { type: string, enum: [undecided, pass, fail] }
                managerMemo: { type: string }
      responses:
        '200':
          description: 변경된 지원서
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Application' }

