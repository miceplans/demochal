    put:
      tags: [Interests]
      summary: 관심분야 저장
      operationId: saveInterests
      x-impl-status: implemented
      description: |
        관심분야 화면(`/my/interests`)의 Chip 그룹 토글 + 저장하기.
        홈의 AI 추천 챌린지 개인화와 연계.
      parameters:
        - name: x-user-id
          in: header
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [categories]
              properties:
                categories: { type: array, items: { type: string } }
      responses:
        '200':
          description: 저장된 관심분야
          content:
            application/json:
              schema:
                type: object
                properties:
                  categories: { type: array, items: { type: string } }
  /notification-settings:
    put:
      tags: [Interests]
      summary: 알림 설정 저장
      operationId: saveNotificationSettings
      x-impl-status: implemented
      description: 알림 설정 화면(`/my/notifications`)의 그룹별 Toggle(팀매칭/마감임박/공고 등) on/off.
      parameters:
        - name: x-user-id
          in: header
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                type: object
                properties:
                  enabled: { type: boolean }
      responses:
        '200':
          description: 저장된 알림 설정
          content:
            application/json:
              schema: { type: object, additionalProperties: { type: boolean } }

  # ---------------------------------------------------------------- Notifications
  /notifications:
    get:
      tags: [Notifications]
      summary: 내 알림 목록 조회
      operationId: listMyNotifications
      x-impl-status: implemented
      description: |
        알림 화면(`/notifications`): 생성일 내림차순, 탭(전체/팀매칭/마감/공고)별 필터.
        푸시/이메일/인앱 소켓 등 실제 채널 발송은 TODO — 현재는 DB 저장만.
      parameters:
        - name: x-user-id
          in: header
          schema: { type: string, format: uuid }
        - name: type
          in: query
          schema:
            { type: string, description: '알림 유형 필터 (team_matching | deadline | posting 등)' }
      responses:
        '200':
          description: 알림 목록
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Notification' } }

  # ---------------------------------------------------------------- Reports
  /reports:
    post:
      tags: [Reports]
      summary: 신고 접수
      operationId: createReport
      x-impl-status: implemented
      description: |
        신고하기 화면(`/reports/new`)의 제출. 공모전 상세, 팀 모집글, 다른 사용자 프로필에서
        신고 버튼으로 진입하며 대상 미리보기가 폼 상단에 표시된다.
        인증: 전역 `JwtAuthGuard`(HttpOnly 쿠키) — 로그인 사용자만 접수 가능, reporter는 세션에서 식별.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateReportRequest' }
      responses:
        '201':
          description: 접수된 신고 (status=open)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Report' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ---------------------------------------------------------------- Businesses
  /businesses:
    post:
      tags: [Businesses]
      summary: 기업(기관) 등록
      operationId: registerBusiness
      x-impl-status: implemented
      description: |
        기업 회원가입 3단계(`/biz/login`: 약관 동의 → 계정 정보 → 기관 인증)의 마지막 단계.
        등록 후 `verificationStatus=pending`이며, 사업자등록증 인증(`POST /verifications`)을 거쳐 승인된다.
      parameters:
        - name: x-user-id
          in: header
          schema: { type: string, format: uuid }
          description: 소유자 사용자 ID (인증 가드 도입 전 임시)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterBusinessRequest' }
      responses:
        '201':
          description: 등록된 기업
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Business' }
  /businesses/{id}:
    get:
      tags: [Businesses]
      summary: 기업 상세 조회
      operationId: getBusiness
      x-impl-status: implemented
      description: 기업 프로필(`/biz/profile`)의 내 기업 정보 카드용.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 기업 정보
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Business' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Businesses]
      summary: 기업 프로필 수정
      operationId: updateBusiness
      x-impl-status: implemented
      description: |
        기업 프로필 편집(`/biz/profile/edit`): 배너/로고 이미지 업로드(선행: `POST /files/presign`),
        기업명/주소/전화/이메일, 콘텐츠 블록(링크/텍스트/파일/레이아웃/이미지).
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                bannerImageFileId: { type: string, format: uuid }
                logoImageFileId: { type: string, format: uuid }
                address: { type: string }
                phone: { type: string }
                email: { type: string, format: email }
                contentBlocks: { type: array, items: { $ref: '#/components/schemas/ContentBlock' } }
      responses:
        '200':
          description: 수정된 기업 정보
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Business' }

  # ---------------------------------------------------------------- Verifications
  /verifications:
    post:
      tags: [Verifications]
      summary: 기관 인증 서류 제출 (사업자등록증)
      operationId: submitVerification
      x-impl-status: implemented
      description: |
        기업 가입의 기관 인증 단계. 파일 업로드(`POST /files/presign` → S3 PUT) 후 fileId로 제출.
        제출 즉시 SQS(`SQS_VERIFICATIONS_QUEUE_URL`)로 OCR 심사 잡을 발송하고 `status=pending`으로 생성된다.
        관리자 심사(`/admin/biz-review`)에서 승인/거부된다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubmitVerificationRequest' }
      responses:
        '201':
          description: 생성된 인증 요청
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Verification' }
  /verifications/{id}:
    get:
      tags: [Verifications]
      summary: 인증 요청 상태 조회
      operationId: getVerification
      x-impl-status: implemented
      description: OCR 결과(`ocrResult`)와 거부 사유(`rejectionReason`) 포함. 기업 프로필의 "인증 서류" 상태 표시용.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 인증 요청 상세
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Verification' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- Files
  /files/presign:
    post:
      tags: [Files]
      summary: Presigned 업로드 URL 발급
      operationId: requestPresignedUpload
      x-impl-status: implemented
      description: |
        S3 PUT presigned URL(유효 5분)을 발급하고 files 레코드를 생성한다.
        용도: 기관 인증 서류, 챌린지 포스터, 기업 배너/로고, 프로필 자격증 첨부 등.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PresignedUploadRequest' }
      responses:
        '201':
          description: 업로드 URL과 파일 메타
          content:
            application/json:
              schema:
                type: object
                properties:
                  uploadUrl: { type: string, description: S3 PUT용 presigned URL (5분 유효) }
                  fileId: { type: string, format: uuid }
                  key: { type: string }
  /files/{id}/finalize:
    post:
      tags: [Files]
      summary: 업로드 완료 확정
      operationId: finalizeUpload
      x-impl-status: implemented
      description: |
        S3 PUT 이후 호출한다. 실제 바이트(Content-Type, 크기, 매직 바이트)를 검증해 `uploadStatus=ready`로
        확정하고, public 요청이면 public 버킷으로 승격한다. 검증 실패 시 객체를 삭제한다.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '201':
          description: 확정된 파일 메타
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FileMeta' }
        '404': { $ref: '#/components/responses/NotFound' }
  /files/{id}:
    get:
      tags: [Files]
      summary: 파일 메타 조회
      operationId: getFile
      x-impl-status: implemented
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 파일 메타 (private 버킷의 실제 다운로드는 별도 presigned GET 필요)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FileMeta' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- Orders / Payments
  /orders/{id}:
    get:
      tags: [Orders]
      summary: 주문 조회
      operationId: getOrder
      x-impl-status: implemented
      description: 광고 결제 등의 주문 정보. 주문 생성 엔드포인트는 향후 광고 결제 플로우(`/biz/ads` checkout) 연동 시 추가.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 주문 정보
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '404': { $ref: '#/components/responses/NotFound' }
  /orders/{id}/cancel:
    post:
      tags: [Orders]
      summary: 주문 취소(신청자 본인, 미결제만)
      operationId: cancelOrder
      x-impl-status: implemented
      description: |
        신청자 본인의 `pending` 주문만 `canceled`로 전환한다. 토스 결제창 진입 실패·구매자 취소 후
        남는 미결제 주문을 정리하는 용도이며, `paid` 등 다른 상태의 주문은 409로 거절된다.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 취소된 주문
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 취소할 수 없는 주문 상태(paid 등) }
  /payments/confirm:
    post:
      tags: [Payments]
      summary: 토스 결제 승인(신청자 본인)
      operationId: confirmPayment
      x-impl-status: implemented
      description: |
        토스 successUrl 리다이렉트 이후 클라이언트가 호출하는 승인 엔드포인트. `paymentKey`·`orderId`·
        `amount`를 토스 승인 API(시크릿 키)로 제출해 결제를 완료하고, 결제 저장과 주문 `paid` 전이를
        하나의 트랜잭션으로 처리한다. 본인의 `pending` 주문만 승인할 수 있고, 이미 `paid`인 주문의
        재요청은 토스 재호출 없이 기존 결과를 돌려준다(새로고침 멱등). 웹훅 재조회는 대사(reconciliation)로 유지.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfirmPaymentRequest' }
      responses:
        '200':
          description: 확정된 주문
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 결제할 수 없는 주문 상태(paid/canceled 등) }
        '502': { description: 토스 승인 API 호출 실패 }
  /payments/webhook/toss:
    post:
      tags: [Payments]
      summary: 토스 결제 웹훅 수신
      operationId: handleTossWebhook
      x-impl-status: implemented
      description: |
        토스페이먼츠 웹훅. `status=DONE`이면 해당 주문을 paid로 처리.
        **TODO**: 웹훅 신원 미검증 — 토스 시크릿키로 `GET /v1/payments/{paymentKey}` 조회 후 상태 확인 필요.
        CANCELED/PARTIAL_CANCELED/EXPIRED 및 Payment 레코드 저장도 TODO.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TossWebhookPayload' }
      responses:
        '200':
          description: 수신 확인
          content:
            application/json:
              schema:
                type: object
                properties:
                  received: { type: boolean }

  # ---------------------------------------------------------------- Billing
  /biz/dashboard:
    get:
      tags: [Billing]
      summary: 기업 대시보드 종합 조회
      operationId: getBizDashboard
      x-impl-status: implemented
      description: |
        기업 대시보드(`/biz/dashboard`)의 모든 위젯을 한 번에 반환한다.
        - `recentPosting` + `stats`: 나의 가장 최근 공고 카드와 클릭수/북마크 StatBox (실집계, `GET /challenges/{id}/stats`와 동일 소스)
        - `monthlyAdExposure`: 광고 노출수 월별 바차트 (라벨 + 값) — 임프레션 비콘이 없어 정직하게 0으로 채워진다 (`GET /ads/{id}/report` 참고)
        - `payments` + `paymentTotal`: 결제 내역(최근 3건, 광고 결제는 음수) — 충전/환불 플로우는 스펙 어디에도
          엔드포인트가 없어 아직 발생할 수 없으므로 항상 음수만 나타난다
        - `activeAds`: 진행중인 광고 테이블
      parameters:
        - name: x-user-id
          in: header
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 대시보드 위젯 데이터
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BizDashboard' }
  /billing/cards:
    get:
      tags: [Billing]
      summary: 결제수단 목록 조회
      operationId: listPaymentCards
      x-impl-status: implemented
      description: 대시보드/결제수단(`/biz/billing`)의 마스킹된 카드 표시(BizPaymentCard).
      responses:
        '200':
          description: 등록된 결제수단 목록
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/PaymentCard' } }
    post:
      tags: [Billing]
      summary: 결제수단 등록
      operationId: registerPaymentCard
      x-impl-status: implemented
      description: |
        토스페이먼츠 빌링키 발급 후 저장. 카드번호는 마스킹되어 반환된다.
        서버는 원본 카드번호를 절대 받지 않으므로(PCI 범위는 토스에 남음) `maskedNumber`는
        빌링키 발급 시 토스가 클라이언트에 직접 내려주는 값을 그대로 전달받아야 한다 —
        원 스키마엔 없던 implemented 확장 필드.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [billingKey, maskedNumber]
              properties:
                billingKey: { type: string, description: 토스 빌링키 }
                cardName: { type: string }
                maskedNumber: { type: string, example: '****-****-****-1234' }
      responses:
        '201':
          description: 등록된 결제수단
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentCard' }
  /billing/history:
    get:
      tags: [Billing]
      summary: 결제 내역 조회
      operationId: listPaymentHistory
      x-impl-status: implemented
      description: |
        결제 내역(`/biz/billing`) 테이블(결제 항목/일시/금액)과 대시보드 요약용.
        amount 부호 규약: 결제(출금)는 음수, 충전·환불은 양수 — 화면에서 녹색(+)·빨간색(-)으로 구분 표시.
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: 결제 내역 목록과 잔액 합계
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/PaymentHistoryItem' } }
                  total:
                    type: integer
                    description: 잔액 합계 (amount 누적, 원)

  /billing/authorizations/customer-key:
    get:
      tags: [Billing]
      summary: 빌링 인증용 customerKey 조회
      operationId: getBillingCustomerKey
      x-impl-status: implemented
      description: |
        토스 빌링 인증(requestBillingAuth)에 필요한 customerKey를 사전에 제공한다.
        customerKey는 서버가 businessId에서 유도(`semochal-biz-<id>`)하며, 인증 성공 리다이렉트와
        빌링키 발급(POST /billing/authorizations/issue)에서 동일 값이 사용된다.
      responses:
        '200':
          description: 빌링 인증용 customerKey
          content:
            application/json:
              schema:
                type: object
                properties:
                  customerKey: { type: string }
                required: [customerKey]
  /billing/authorizations/issue:
    post:
      tags: [Billing]
      summary: 빌링 인증 authKey로 카드 등록
      operationId: issueBillingAuthorization
      x-impl-status: implemented
      description: |
        빌링 인증 성공 리다이렉트의 authKey를 받아 토스 빌링키 발급 API(서버 시크릿 키 사용)로
        billingKey를 발급·저장한다. billingKey는 절대 응답에 포함하지 않는다(PCI 경계 유지).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                authKey: { type: string }
              required: [authKey]
      responses:
        '201':
          description: 등록된 결제수단(billingKey 미포함)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentCard' }

  # ---------------------------------------------------------------- Ads
  /ads/products:
    get:
      tags: [Ads]
      summary: 광고 상품(노출 위치) 목록 조회
      operationId: listAdProducts
      x-impl-status: implemented
      description: |
        광고 추가 플로우(`/biz/ads`)의 노출 위치 선택(AdPlacementPreview, PC/모바일 뷰 토글).
        placement 종류: `hero`(홈 상단 대형 배너), `gallery`(홈 중간 이미지 갤러리),
        `team`(팀 탐색 페이지 배너). 각 상품은 관리자가 설정한 일일 단가(`dailyPrice`)로
        단가 × 기간 일수 = 결제 금액(일일 5,000원 × N일 형태의 단기 결제 팝업)을 계산한다.
      responses:
        '200':
          description: 광고 상품 목록
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/AdProduct' } }
  /ads:
    get:
      tags: [Ads]
      summary: 내 광고 목록 조회
      operationId: listMyAds
      x-impl-status: implemented
      description: 광고 관리 화면(`/biz/ads`)의 진행중인 광고 테이블과 대시보드 차트용.
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [active, paused, ended] }
      responses:
        '200':
          description: 광고 목록
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Ad' } }
    post:
      tags: [Ads]
      summary: 광고 등록 (기간 선택 + 결제)
      operationId: createAd
      x-impl-status: implemented
      description: |
        단기 결제 팝업(react-day-picker 기간 선택, 일일 단가 × 기간 = 결제 금액) → 결제수단 확인 → 완료.
        주문 생성(`orders.adId`) → 토스 결제 → 웹훅(`POST /payments/webhook/toss`)이
        주문을 paid로 바꾸면 `OrdersService.markPaid`가 이 광고를 자동으로 `active`로 전환한다.
        생성 직후에는 결제 대기 상태인 `preparing`으로 반환된다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId, startDate, endDate]
              properties:
                productId: { type: string }
                expectedDailyPrice:
                  {
                    type: integer,
                    minimum: 0,
                    description: 화면에서 확인한 단가. 최신 단가와 다르면 409로 재확인 요청.,
                  }
                imageFileId: { type: string, format: uuid }
                landingUrl: { type: string }
                startDate: { type: string, format: date }
                endDate: { type: string, format: date }
                title:
                  {
                    type: string,
                    description: 'implemented 확장 — 원 스키마엔 title/challengeId가 없어 Ad.title의 출처가 비어 있었음. 생략 시 "{상품명} 광고"로 대체.',
                  }
      responses:
        '201':
          description: 생성된 광고 (결제 대기). 계약과 주문 금액은 생성 시점 단가로 고정. 종료일 포함 일 단위 계약이며 기존 계약 종료일 다음 날부터 예약 가능.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ad' }
        '409':
          description: 기존 계약과 기간 중복 또는 확인한 단가가 변경됨
  /ads/{id}:
    patch:
      tags: [Ads]
      summary: 광고 상태 변경 (중단 등)
      operationId: updateAd
      x-impl-status: implemented
      description: 관리자 광고 관리(`/admin/ad-pricing`)의 활동 메뉴(수정/납볍/중단)와 기업측 중단.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [active, paused, ended] }
      responses:
        '200':
          description: 변경된 광고
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ad' }
  /ads/{id}/report:
    get:
      tags: [Ads]
      summary: 광고 성과 리포트 (기간별)
      operationId: getAdReport
      x-impl-status: implemented
      description: |
        기업 리포트(`/biz/reports`)와 관리자 리포트(`/admin/analytics?ad=N`).
        - `totals`: 화면 상단의 합계 행(일별/시간별 테이블 상단 '합계' 로우와 동일 — 서버 계산 권장)
        - `daily`: 일별 리포트 테이블(날짜/노출/클릭/클릭률)
        - `hourly`: 시간 리포트 테이블(시간대/노출/클릭/클릭률, 0시~24시 24개 슬롯)
        - `monthlyClicks`: 상단 월별 클릭수 바차트(라벨 + 값)
        기간 선택 옵션(8/25~8/27, 8/25~8/31, 9/1~9/7 등)은 `from`/`to` 쿼리로 처리.
        노출/클릭은 광고별 서울 시간 기준 시간 버킷 카운터에서 집계한다.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: 일별/시간별 성과 데이터
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdReport' }
  /ads/{id}/impressions:
    post:
      tags: [Ads]
      summary: 광고 노출 계측
      operationId: recordAdImpression
      security: []
      description: active 광고의 노출을 개인정보 없이 시간 버킷 카운터에 반영한다.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdEvent' }
      responses:
        '201':
          description: 계측 결과
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdEventResult' }
  /ads/{id}/clicks:
    post:
      tags: [Ads]
      summary: 광고 클릭 계측
      operationId: recordAdClick
      security: []
      description: active 광고의 클릭을 개인정보 없이 시간 버킷 카운터에 반영한다.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdEvent' }
      responses:
        '201':
          description: 계측 결과
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdEventResult' }

  # ---------------------------------------------------------------- Operations
  /operations/inquiries:
    post:
      tags: [Operations]
      summary: 운영대행 문의 접수
      operationId: submitOperationsInquiry
      x-impl-status: implemented
      description: |
        운영대행 페이지(`/biz/operations`, MICE PLANS X SEMO)의 온라인 상담/견적 문의 폼
        (성함/연락처/문의내용). 회사 위치 지도·주소·연락처는 정적 정보.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, contact, content]
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                contact:
                  { type: string, minLength: 1, maxLength: 200, description: 전화번호 또는 이메일 }
                content: { type: string, minLength: 1, maxLength: 4000 }
      responses:
        '201':
          description: 접수 완료
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  received: { type: boolean }

  # ---------------------------------------------------------------- Admin
  /admin/dashboard:
    get:
      tags: [Admin]
      summary: 관리자 대시보드 통계
      operationId: getAdminDashboard
      x-impl-status: implemented
      description: |
        관리자 대시보드(`/admin`)의 위젯 데이터 묶음.
        - `stats`: 통계 카드 4종(승인된 기관/진행 중 챌린지/누적 제출물/신규 가입자) — label + 값 + 보조 문구
        - `adRatio`: '유저 광고 비율' 반원 게이지 (RadialBarChart) — `ratio`는 0~1, 화면에서 ×100 퍼센트 표기
        - `traffic`: '유저 트래픽' 라인·영역 혼합 차트(ComposedChart) — `range` 쿼리로 7일/30일/1년 전환,
          primary(일반 유저)·secondary(비즈니스) 두 개 시리즈
        - `reports`: 신고 로그 테이블(ReportLogTable)
      parameters:
        - name: range
          in: query
          schema: { type: string, enum: [7days, 30days, 1year], default: 1year }
          description: '트래픽 차트 기간 (탭: 7 days / 30 days / 1년)'
      responses:
        '200':
          description: 대시보드 위젯 데이터
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminDashboard' }
  /admin/businesses:
    get:
      tags: [Admin]
      summary: 기관 심사 목록 + 심사 현황 통계 조회
      operationId: listAdminBusinesses
      x-impl-status: implemented
      description: |
        기관 심사(`/admin/biz-review`).
        - `stats`: 상단 통계 카드 4종(전체 신청/승인/거부/대기) — dot 색상 포함
        - `items`: 기관 테이블 — 활동유형(org)/유형/사업자번호(마스킹)/신청일/NTS OCR 결과/상태 뱃지.
          행 클릭 시 우측 상세 패널(기관 정보 + 대기 상태일 때 승인/거부 버튼) 표시.
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: type
          in: query
          schema: { type: string, description: 기관 유형 (비영리/학교/협회/기업) }
        - name: status
          in: query
          schema: { type: string, enum: [pending, approved, rejected] }
      responses:
        '200':
          description: 기관 심사 목록과 통계
          content:
            application/json:
              schema:
                type: object
                properties:
                  stats: { $ref: '#/components/schemas/AdminStatCardList' }
                  items: { type: array, items: { $ref: '#/components/schemas/BizReviewEntry' } }
  /admin/verifications/{id}/approve:
    post:
      tags: [Admin]
      summary: 기관 인증 승인
      operationId: approveVerification
      x-impl-status: implemented
      description: 심사 상세 패널의 승인 버튼. 승인 시 기업의 `verificationStatus=approved`로 갱신 + 알림 발송.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 승인 처리된 인증 요청
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Verification' }
  /admin/verifications/{id}/reject:
    post:
      tags: [Admin]
      summary: 기관 인증 거부
      operationId: rejectVerification
      x-impl-status: implemented
      description: 거부 사유(`rejectionReason`) 기록 + 기업에 알림.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
      responses:
        '200':
          description: 거부 처리된 인증 요청
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Verification' }
  /admin/certificates:
    get:
      tags: [Admin]
      summary: 상장(자격/수상) 인증 목록 조회
      operationId: listAdminCertificates
      x-impl-status: implemented
      description: '인증 관리(`/admin/certificates`): 미인증/인증/거부 탭, 사용자 검색/유형 필터, 상장 썸네일.'
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [pending, verified, rejected] }
        - name: q
          in: query
          schema: { type: string }
      responses:
        '200':
          description: 인증 요청 목록
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CertificateEntry' }
  /admin/certificates/{id}/verify:
    post:
      tags: [Admin]
      summary: 상장 인증 승인/거부
      operationId: verifyCertificate
      x-impl-status: implemented
      description: |
        상장 인증(`/admin/certificates`): 탭(미인증/인증/거부) + 사용자 검색/유형(수상 실적/출품 이력) 필터.
        썸네일 클릭 시 원본 이미지 오버레이 → 승인/거부. 승인 시 사용자 프로필 뱃지 부여.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [approve, reject] }
                reason: { type: string }
      responses:
        '200':
          description: 처리 완료된 인증 항목
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CertificateEntry' }
  /admin/ads:
    get:
      tags: [Admin]
      summary: 전체 광고 목록 조회
      operationId: listAdminAds
      x-impl-status: implemented
      description: '광고 관리(`/admin/ad-pricing`): 검색/상태 필터, 행 선택 후 광고 중단.'
      parameters:
        - name: q
          in: query
          schema: { type: string }
          description: 광고명/기관명 부분 일치 검색
        - name: status
          in: query
          schema: { type: string }
          description: '광고 상태 필터 (active/preparing/paused/ended)'
      responses:
        '200':
          description: 광고 목록
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/AdminAdEntry' } }
  /admin/ad-pricing:
    get:
      tags: [Admin]
      summary: 광고 단가 조회
      operationId: getAdPricing
      x-impl-status: implemented
      description: |
        광고비 관리(`/admin/ad-pricing/pricing`): PC/모바일 뷰 토글로 홈 화면 미리보기(MovingAds 캐러셀,
        챌린지/팀 카드)를 재현. 슬롯 클릭 → 다이얼로그(현재 광고사/기간, '리포트 보기' → `/admin/analytics?ad=N`)
        → 금액 수정하기에서 하루 광고비 입력/저장.
      responses:
        '200':
          description: 슬롯별 단가 정보
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AdSlotPricing' }
    put:
      tags: [Admin]
      summary: 광고 단가 수정
      operationId: updateAdPricing
      x-impl-status: implemented
      description: 슬롯 클릭 다이얼로그에서 하루 광고비 입력/저장 (`adPricing.dailyPrice`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                required: [slot, dailyPrice]
                properties:
                  slot: { type: string, enum: [hero, gallery, team] }
                  dailyPrice: { type: integer, description: 일일 광고비 (원) }
      responses:
        '200':
          description: 저장된 단가
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/AdSlotPricing' } }
  /admin/users:
    get:
      tags: [Admin]
      summary: 사용자 목록 조회
      operationId: listAdminUsers
      x-impl-status: implemented
      description: |
        사용자 관리(`/admin/users`): 이름/이메일(마스킹)/포지션/신고 누적/상태(활성·정지) 테이블,
        가입일/뱃지/활동상태 필터.
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [active, suspended] }
      responses:
        '200':
          description: 사용자 목록
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/AdminUserEntry' } }
  /admin/users/{id}/suspend:
    post:
      tags: [Admin]
      summary: 사용자 정지/해제
      operationId: suspendUser
      x-impl-status: implemented
      description: 상태 뱃지(활성·정지) 토글.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [suspended]
              properties:
                suspended: { type: boolean }
                reason: { type: string }
      responses:
        '200':
          description: 변경된 사용자
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUserEntry' }
  /admin/reports:
    get:
      tags: [Admin]
      summary: 신고 로그 조회
      operationId: listAdminReports
      x-impl-status: implemented
      description: |
        신고 처리(`/admin/reports`)와 대시보드/콘텐츠 모니터링의 신고 로그 테이블(ReportLogTable).
        검색/필터 + 엑셀 납볍. 상태 한글 표기: 대기·승인(조치)·거부(기각).
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [open, resolved, dismissed] }
      responses:
        '200':
          description: 신고 목록
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Report' }
  /admin/reports/{id}/resolve:
    post:
      tags: [Admin]
      summary: 신고 처리 (조치/기각)
      operationId: resolveReport
      x-impl-status: implemented
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [resolve, dismiss] }
                note: { type: string }
      responses:
        '200':
          description: 처리된 신고
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Report' }
  /admin/contents:
    get:
      tags: [Admin]
      summary: 콘텐츠 모니터링 조회
      operationId: listAdminContents
      x-impl-status: implemented
      description: |
        콘텐츠 모니터링(`/admin/contents`).
        - `teams`: '확인해야하는 팀' 카드(팀명/챌린지/역할 뱃지/참여 인원, 미확인 도트)
        - `contests`: '확인해야하는 챌린지' 카드(카테고리/D-day/팀 모집 건수, 미확인 도트)
        - `reports`: 신고 로그 테이블
      responses:
        '200':
          description: 모니터링 대상 콘텐츠
          content:
            application/json:
              schema:
                type: object
                properties:
                  teams: { type: array, items: { $ref: '#/components/schemas/AdminTeamCard' } }
                  contests:
                    { type: array, items: { $ref: '#/components/schemas/AdminContestCard' } }
                  reports: { type: array, items: { $ref: '#/components/schemas/Report' } }
  /admin/analytics:
    get:
      tags: [Admin]
      summary: 전체 리포트/분석
      operationId: getAdminAnalytics
      x-impl-status: implemented
      description: |
        리포트(`/admin/analytics`).
        - `?ad=N` 지정 시: 빅배버 N번 광고 리포트 — 기관·기간, 통계 카드 4종(노출수/클릭수/CTR/집행 광고비),
          일별 성과 차트(AdReportChart: 노출 영역 + 클릭 라인, 이중 Y축)
        - `stats`: 전체 통계 카드 3종(신규 가입자/신규 챌린지/플랫폼 수익)
        - `activity`: 활동 차트(ActivityChart, 월별 일반/기업 이중 영역차트, yMax 상한)
        - 납볍하기 버튼
      parameters:
        - name: ad
          in: query
          schema:
            type: integer
            description: '광고 번호 (특정 광고 리포트 시, ?ad=N)'
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: 분석 데이터
          content:
            application/json:
              schema:
                type: object
                properties:
                  adReport:
                    {
                      nullable: true,
                      description: '?ad=N 지정 시에만 포함',
                      allOf: [{ $ref: '#/components/schemas/AdminAdReport' }],
                    }
                  stats: { $ref: '#/components/schemas/AdminStatCardList' }
                  activity: { $ref: '#/components/schemas/ActivityChart' }
  /admin/settings:
    get:
      tags: [Admin]
      summary: 관리자 설정 조회
      operationId: getAdminSettings
      x-impl-status: implemented
      description: |
        설정(`/admin/settings`). `groups`는 설정 항목 메타(제목/키/라벨/설명)를,
        `values`는 현재 값(키 → boolean)을 담는다. 키 예: bizAutoApprove(기관 가입 자동 승인),
        contestAutoPublish(공고 자동 게시), maintenanceMode(점검 모드), reportAlert(신고 접수 알림) 등.
      responses:
        '200':
          description: 설정 값
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminSettings' }
    put:
      tags: [Admin]
      summary: 관리자 설정 저장
      operationId: updateAdminSettings
      x-impl-status: implemented
      description: 변경된 키만 partial로 본문에 담아 저장. 저장하기 버튼은 토스트 피드백.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: { type: boolean }
      responses:
        '200':
          description: 저장된 설정
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminSettings' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT 액세스 토큰(향후 도입). 현재는 `x-user-id` 헤더로 사용자를 식별하는 개발 중 상태.
  responses:
    NotFound:
      description: 리소스를 찾을 수 없음
      content:
        application/json:
          schema:
            type: object
            properties:
              statusCode: { type: integer, example: 404 }
              message: { type: string, example: Not found }
    Unauthorized:
      description: 인증 실패
      content:
        application/json:
          schema:
            type: object
            properties:
              statusCode: { type: integer, example: 401 }
              message: { type: string, example: Unauthorized }
  schemas:
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }
        role: { type: string, enum: [user, business, admin], description: 사용자 | 기업 | 관리자 }
        username: { type: string, nullable: true, description: 기업 계정 로그인 아이디 }
        phone: { type: string, nullable: true }
        emailVerifiedAt: { type: string, format: date-time, nullable: true }
        phoneVerifiedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        # 아래는 planned 프로필 확장 (프론트 목업 기준)
        position: { type: string, description: 포지션 }
        region: { type: string }
        stacks: { type: array, items: { type: string } }
        badges:
          {
            type: array,
            items: { type: string },
            description: 깃허브 인증/포트폴리오/출품이력/자격 인증 뱃지,
          }
        externalLinks: { type: array, items: { $ref: '#/components/schemas/ExternalLink' } }
        awardHistory: { type: array, items: { $ref: '#/components/schemas/AwardRecord' } }
    ExternalLink:
      type: object
      properties:
        label: { type: string }
        url: { type: string }
    AwardRecord:
      type: object
      properties:
        title: { type: string }
        organization: { type: string }
        date: { type: string }
        prize: { type: string, description: 수상 등급 }
    OnboardingSurvey:
      type: object
      description: 가입 후 4단계 설문 (useUserStore.survey)
      properties:
        isActive: { type: boolean, description: 1단계 활동 여부 }
        interests: { type: array, items: { type: string }, description: 2단계 관심 분야 Chip }
        purposes: { type: array, items: { type: string }, description: 3단계 목적 Chip }
        challengeTypes: { type: array, items: { type: string }, description: 4단계 도전 유형 Chip }
    Challenge:
      type: object
      properties:
        id: { type: string, format: uuid }
        businessId: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        price: { type: integer, description: 참가비 (원) }
        capacity: { type: integer, description: 모집 인원 }
        startDate: { type: string, format: date-time }
        endDate: { type: string, format: date-time }
        status: { type: string, enum: [draft, published, closed], description: 등록 시 draft }
        createdAt: { type: string, format: date-time }
        category:
          { type: string, description: 'implemented — 생성 시 저장, 유사 챌린지 추천에 사용' }
        # planned 확장 (공고 등록 폼/상세 화면 목업 기준, category 제외)
        posterFileId: { type: string, format: uuid }
        organizer: { type: string }
        eligibility: { type: string, description: 지원 자격 }
        hashtags: { type: array, items: { type: string } }
        recruitMethod:
          { type: string, enum: [seMOchall, external], description: 세모챌 내 신청폼 | 외부 링크 }
        recruitUrl: { type: string }
        contact: { type: string, description: 문의 연락처 }
        roles: { type: array, items: { type: string }, description: 모집 역할 }
        applicationFormId:
          { type: string, format: uuid, description: 신청폼 (질문 유형 6가지 빌더) }
    CreateChallengeRequest:
      type: object
      required: [businessId, title, description, price, capacity, startDate, endDate]
      properties:
        businessId: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        price: { type: integer, minimum: 1 }
        capacity: { type: integer, minimum: 1 }
        startDate: { type: string, format: date-time }
        endDate: { type: string, format: date-time }
        category:
          {
            type: string,
            description: '유사 챌린지 추천(`GET /challenges/{id}/similar`)에 쓰이는 최소 분류 필드. Challenge의 다른 planned 확장 필드(포스터/자격요건 등)는 아직 미구현.',
          }
    UpdateChallengeRequest:
      type: object
      description: 보낸 필드만 수정한다. businessId/status는 수정할 수 없다.
      properties:
        title: { type: string, maxLength: 200 }
        description: { type: string, maxLength: 20000 }
        price: { type: integer, minimum: 0 }
        capacity: { type: integer, minimum: 1 }
        startDate: { type: string, format: date-time }
        endDate: { type: string, format: date-time }
        category:
          { type: string, nullable: true, maxLength: 100, description: null이면 카테고리를 비운다 }
    Team:
      type: object
      properties:
        id: { type: string, format: uuid }
        challengeId: { type: string, format: uuid }
        leaderUserId: { type: string, format: uuid }
        title: { type: string, description: '팀명 (미입력 시 "<팀장 이름>의 팀")' }
        leaderRole: { type: string, nullable: true, description: 팀장 역할 }
        introduction: { type: string, nullable: true, description: 팀 소개 }
        preferred: { type: string, nullable: true, description: 우대사항 }
        etc: { type: string, nullable: true, description: 기타 }
        region: { type: string }
        openRoles:
          {
            type: array,
            items: { $ref: '#/components/schemas/TeamRoleSlot' },
            description: 필요 역할 슬롯,
          }
        status: { type: string, enum: [recruiting, closed] }
        createdAt: { type: string, format: date-time }
        challengeTitle: { type: string, description: 목록·상세 응답에 포함 }
        leaderName: { type: string, description: 목록·상세 응답에 포함 }
        filledRoles:
          {
            type: array,
            items: { type: string },
            description: '목록 응답 전용 — 승인(accepted)된 팀원 역할',
          }
        members:
          {
            type: array,
            items: { $ref: '#/components/schemas/TeamMember' },
            description: 상세 응답 전용 — 팀원(대기·승인·거절 포함),
          }
    TeamMember:
      type: object
      properties:
        id: { type: string, format: uuid }
        teamId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        name: { type: string, description: 상세 응답에 포함 }
        role: { type: string, nullable: true }
        status: { type: string, enum: [pending, accepted, rejected] }
        createdAt: { type: string, format: date-time }
    JoinTeamRequest:
      type: object
      properties:
        role: { type: string, description: 지원 역할 }
    TeamRoleSlot:
      type: object
      properties:
        role: { type: string }
        count: { type: integer }
    CreateTeamRequest:
      type: object
      required: [challengeId, myRole]
      properties:
        challengeId: { type: string, format: uuid }
        title: { type: string, maxLength: 200, description: '생략 시 "<팀장 이름>의 팀"' }
        introduction: { type: string, maxLength: 1000, description: 팀 소개 }
        preferred: { type: string, maxLength: 200, description: 우대사항 }
        etc: { type: string, maxLength: 200, description: 기타 }
        openRoles: { type: array, items: { $ref: '#/components/schemas/TeamRoleSlot' } }
        myRole: { type: string, description: 내 역할 }
        region: { type: string }
    Application:
      type: object
      properties:
        id: { type: string, format: uuid }
        challengeId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        status: { type: string, enum: [pending, accepted, rejected], description: 등록 시 pending }
        createdAt: { type: string, format: date-time }
        # planned 확장 (지원서 화면/기업 지원관리 목업 기준)
        role: { type: string, description: 지원 역할 }
        teammates: { type: array, items: { type: string }, description: 팀원 구성 }
        evaluation: { type: string, enum: [undecided, pass, fail] }
        managerMemo: { type: string }
    ApplyChallengeRequest:
      type: object
      required: [challengeId]
      properties:
        challengeId: { type: string, format: uuid }
        role: { type: string }
        teammates: { type: array, items: { type: string } }
        formAnswers:
          {
            type: array,
            items: { type: object, additionalProperties: true },
            description: 신청폼 응답 (planned),
          }
    Notification:
      type: object
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        type: { type: string, description: '알림 유형 (team_matching | deadline | posting 등)' }
        payload: { type: object, additionalProperties: true }
        readAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
    Business:
      type: object
      properties:
        id: { type: string, format: uuid }
        ownerUserId: { type: string, format: uuid }
        name: { type: string, nullable: true, description: 기관명 (OCR/프로필 편집으로 채움) }
        registrationNumber:
          type: string
          nullable: true
          description: 사업자등록번호 (10자리, 학교/비영리 등은 null, 관리자 화면에서 마스킹 표시)
        type: { type: string, enum: [기업, 학교, 비영리, 협회], nullable: true }
        verificationStatus: { type: string, enum: [pending, approved, rejected] }
        createdAt: { type: string, format: date-time }
        # planned 확장 (기업 프로필 편집 목업 기준)
        bannerImageFileId: { type: string, format: uuid }
        logoImageFileId: { type: string, format: uuid }
        address: { type: string }
        phone: { type: string }
        email: { type: string, format: email }
        contentBlocks: { type: array, items: { $ref: '#/components/schemas/ContentBlock' } }
    ContentBlock:
      type: object
      description: 기업 프로필 콘텐츠 블록 (링크/텍스트/파일/레이아웃/이미지 툴바)
      properties:
        type: { type: string, enum: [link, text, file, layout, image] }
        content: { type: object, additionalProperties: true }
    RegisterBusinessRequest:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [기업, 학교, 비영리, 협회], description: 기관 유형 }
        name: { type: string, maxLength: 200 }
        registrationNumber: { type: string, pattern: '^\d{10}$' }
    Verification:
      type: object
      properties:
        id: { type: string, format: uuid }
        businessId: { type: string, format: uuid }
        documentFileId: { type: string, format: uuid }
        status: { type: string, enum: [pending, approved, rejected] }
        ocrResult:
          {
            type: object,
            additionalProperties: true,
            nullable: true,
            description: OCR 추출 결과 (jsonb),
          }
        rejectionReason: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    SubmitVerificationRequest:
      type: object
      required: [businessId, documentFileId]
      properties:
        businessId: { type: string, format: uuid }
        documentFileId:
          { type: string, format: uuid, description: presign 업로드 후 발급받은 파일 ID }
    FileMeta:
      type: object
      properties:
        id: { type: string, format: uuid }
        bucket: { type: string, enum: [public, private] }
        key: { type: string }
        contentType: { type: string }
        createdAt: { type: string, format: date-time }
        url:
          {
            type: string,
            nullable: true,
            description: 'CloudFront public URL; set only once a public file has finished upload verification (uploadStatus ready). Null for private files and pending/rejected uploads.',
          }
    PresignedUploadRequest:
      type: object
      required: [bucket, contentType, fileName, sizeBytes]
      properties:
        bucket: { type: string, enum: [public, private] }
        contentType: { type: string, enum: [image/jpeg, image/png, image/webp, application/pdf] }
        fileName: { type: string, maxLength: 255 }
        sizeBytes:
          { type: integer, minimum: 1, maximum: 10485760, description: 파일 크기 (최대 10MB) }
    Order:
      type: object
      properties:
        id: { type: string, format: uuid }
        applicationId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        amount: { type: integer, description: 결제 금액 (원) }
        status: { type: string, enum: [pending, paid, canceled] }
        createdAt: { type: string, format: date-time }
    ConfirmPaymentRequest:
      type: object
      required: [orderId, paymentKey, amount]
      properties:
        orderId: { type: string, format: uuid }
        paymentKey: { type: string, description: 토스 결제 키(successUrl 쿼리) }
        amount: { type: integer, description: 주문 금액과 반드시 일치(위변조 방어) }
    TossWebhookPayload:
      type: object
      required: [eventType, data]
      properties:
        eventType: { type: string, description: 이벤트 유형 }
        data:
          type: object
          required: [paymentKey, orderId, status]
          properties:
            paymentKey: { type: string }
            orderId: { type: string }
            status:
              {
                type: string,
                description: 'DONE | CANCELED | PARTIAL_CANCELED | EXPIRED | ABORTED | WAITING_FOR_DEPOSIT',
              }
    PaymentCard:
      type: object
      required: [id, maskedNumber]
      properties:
        id: { type: string, format: uuid }
        cardName: { type: string }
        maskedNumber: { type: string, example: '****-****-****-1234' }
    PaymentHistoryItem:
      type: object
      required: [id, name, amount, paidAt, status]
      properties:
        id: { type: string, format: uuid }
        name:
          {
            type: string,
            description: '결제 항목 (예: 2025 스타트업 해커톤 - 메인 배너 (대), 충전 - 신용카드)',
          }
        amount:
          {
            type: integer,
            description: '부호 있는 금액 (원) — 결제는 음수, 충전·환불은 양수',
            example: -100000,
          }
        paidAt: { type: string, format: date-time }
        status: { type: string, enum: [paid, refunded, failed] }
    AdProduct:
      type: object
      properties:
        reservedPeriods:
          type: array
          description: 결제 대기, 진행 중, 일시 정지 계약의 예약 불가 기간. 종료일 포함.
          items:
            type: object
            required: [startDate, endDate]
            properties:
              startDate: { type: string, format: date-time }
              endDate: { type: string, format: date-time }
        id: { type: string }
        name: { type: string, description: '상품명 (예: 메인 배너 (대))' }
        description:
          type: string
          description: '노출 설명 (예: 홈 상단 대형 배너, 마감 임박 공고 우선 노출)'
        placement:
          {
            type: string,
            enum: [hero, gallery, team],
            description: '노출 위치 — hero: 홈 상단, gallery: 홈 중간 갤러리, team: 팀 탐색 페이지,',
          }
        dailyPrice:
          type: integer
          description: 일일 광고비 (원, 관리자가 설정한 단가)
        previewImageUrl: { type: string, description: PC/모바일 뷰 미리보기 이미지 }
    Ad:
      type: object
      properties:
        id: { type: string, format: uuid }
        businessId: { type: string, format: uuid }
        productId: { type: string }
        title: { type: string, description: 광고명 (연결된 챌린지명) }
        imageFileId: { type: string, format: uuid }
        imageUrl:
          {
            type: string,
            nullable: true,
            description: imageFileId가 가리키는 파일의 CloudFront 공개 URL (ready 상태일 때만 값이 있음),
          }
        landingUrl: { type: string }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        status:
          {
            type: string,
            enum: [active, preparing, paused, ended],
            description: 진행중/준비중/중단됨/만료 — 대시보드 '진행중인 광고' 테이블 표기용,
          }
        impressions: { type: integer, nullable: true, description: 누적 노출수 (준비중이면 null) }
        bookmarks: { type: integer, nullable: true, description: 누적 북마크수 (준비중이면 null) }
        paidAmount: { type: integer, description: 결제 금액 (원) }
    AdReport:
      type: object
      properties:
        totals: { $ref: '#/components/schemas/MetricTotals' }
        daily:
          type: array
          items: { $ref: '#/components/schemas/DailyMetric' }
        hourly:
          type: array
          description: 24시간 슬롯 (0시~1시 … 23시~24시)
          items: { $ref: '#/components/schemas/HourlyMetric' }
        monthlyClicks:
          type: array
          items: { $ref: '#/components/schemas/MonthlyBar' }
          description: 상단 월별 클릭수 바차트 (라벨 + 값)
    AdEvent:
      type: object
      properties:
        eventId:
          type: string
          format: uuid
          description: 클라이언트 중복 억제를 위한 일회성 식별자
    AdEventResult:
      type: object
      required: [recorded]
      properties:
        recorded: { type: boolean }
    MetricTotals:
      type: object
      description: 일별/시간별 테이블 상단 '합계' 행 — 서버에서 계산해 남긴다
      properties:
        impressions: { type: integer }
        clicks: { type: integer }
        ctr: { type: number, description: '합계 클릭률 (%) = clicks / impressions × 100' }
    HourlyMetric:
      type: object
      properties:
        hour: { type: integer, description: 시간대 시작 시각 (0~23) }
        label: { type: string, description: '"화면 표기용 라벨 (예: ''9시~10시'')"' }
        impressions: { type: integer, description: 노출수 }
        clicks: { type: integer, description: 클릭수 }
        ctr: { type: number, description: 클릭률 (%) }
    MonthlyBar:
      type: object
      description: 월별 바차트/영역차트 공용 포인트 (라벨 + 값)
      properties:
        label: { type: string, description: '"월 라벨 (예: ''7월'')"' }
        value: { type: integer }
    StatWithDelta:
      type: object
      description: |
        StatBox 위젯 — 값과 전주 대비 증감을 함께 표시
        (예: 클릭수 8,341번 / +8.2% 전주 대비).
        서버는 원시 수치와 퍼센트를 남기고, 화면에서 '8,341번' 형태로 포맷팅.
      properties:
        value: { type: integer }
        deltaPercent: { type: number, description: '전주 대비 증감률 (%) — 음수면 감소' }
    ChallengeStats:
      type: object
      description: 공고 관리 화면의 그래프 데이터 묶음
      properties:
        clicks: { $ref: '#/components/schemas/StatWithDelta' }
        bookmarks: { $ref: '#/components/schemas/StatWithDelta' }
        exposure:
          {
            allOf: [{ $ref: '#/components/schemas/StatWithDelta' }],
            description: '노출수 (예: 124,582 조회수 / +12.5% 전주 대비)',
          }
        applicantDistribution:
          type: array
          description: 지원자 분포 파이차트 — value는 백분율(0~100), 합계 100
          items: { $ref: '#/components/schemas/LabelValue' }
        monthlyExposure:
          type: array
          items: { $ref: '#/components/schemas/MonthlyBar' }
          description: 공고 노출수 영역차트 겸 월별 바차트 (chartMonths/chartBars와 동일 형태)
    BizDashboard:
      type: object
      description: 기업 대시보드(`/biz/dashboard`) 위젯 데이터 묶음
      properties:
        recentPosting: { $ref: '#/components/schemas/Challenge' }
        stats:
          type: object
          properties:
            clicks: { $ref: '#/components/schemas/StatWithDelta' }
            bookmarks: { $ref: '#/components/schemas/StatWithDelta' }
            exposure: { $ref: '#/components/schemas/StatWithDelta' }
        monthlyAdExposure:
          type: array
          items: { $ref: '#/components/schemas/MonthlyBar' }
          description: 광고 노출수 월별 바차트 (chartMonths/chartBars와 동일 형태)
        payments:
          type: array
          items: { $ref: '#/components/schemas/PaymentHistoryItem' }
          description: 최근 결제 내역 (대시보드는 상위 3건)
        paymentTotal: { type: integer, description: 잔액 합계 (원) }
        activeAds: { type: array, items: { $ref: '#/components/schemas/Ad' } }
    DailyMetric:
      type: object
      properties:
        date: { type: string, format: date }
        impressions: { type: integer, description: 노출수 }
        clicks: { type: integer, description: 클릭수 }
        ctr: { type: number, description: 클릭률 (%) }
    LabelValue:
      type: object
      properties:
        label: { type: string }
        value: { type: number }
    AdminStatCard:
      type: object
      description: |
        관리자 화면 통계 카드 (StatRow/StatCard) — label + 포맷된 값 + 보조 문구 + 도트 색.
        서버는 value를 원시 수치로, 포맷('1,248'·'₩42.8M')은 화면에서 처리하는 것을 권장.
      properties:
        label: { type: string, description: '카드 제목 (예: 승인된 기관)' }
        value: { type: string, description: '표시 값 (예: 1,248 / ₩42.8M)' }
        meta: { type: string, description: '보조 문구 (예: +12 이번 주 / 월간)' }
        dot: { type: string, nullable: true, description: '도트 색상 (hex, 예: #0877FF)' }
    AdminStatCardList:
      type: array
      items: { $ref: '#/components/schemas/AdminStatCard' }
    AdRatioGauge:
      type: object
      description: |
        '유저 광고 비율' 반원 게이지 (RadialBarChart + GaugeBar). ratio 0~1 → 화면에서 퍼센트로 변환.
      properties:
        value: { type: string, description: "중앙 상단 금액 (예: '100,000 ₩')" }
        ratio: { type: number, description: '게이지 비율 (0~1, 예: 0.72 → 72%)' }
    TrafficSeries:
      type: object
      description: |
        '유저 트래픽' 차트 데이터 — 라벨 배열 + 일반 유저(primary)·비즈니스(secondary) 두 시리즈.
        labels[i]와 primary[i]/secondary[i]가 인덱스로 대응 (recharts 데이터 조립 방식).
      properties:
        labels:
          {
            type: array,
            items: { type: string },
            description: "X축 라벨 (예: 'JAN'~'DEC' 또는 '1일'~'7일')",
          }
        primary: { type: array, items: { type: number }, description: 일반 유저 트래픽 }
        secondary: { type: array, items: { type: number }, description: 비즈니스 트래픽 }
    BizReviewEntry:
      type: object
      description: 기관 심사 테이블 행 (BizRow). 사업자번호는 서버에서 마스킹 후 전달.
      properties:
        id: { type: string, format: uuid }
        org: { type: string, description: 기관명 (활동유형 컬럼) }
        type: { type: string, description: 기관 유형 (비영리/학교/협회/기업) }
        bizNumber: { type: string, description: '마스킹된 사업자번호 (예: 110-81-*****)' }
        appliedAt: { type: string, description: '신청일 (예: 05.12)' }
        nts:
          {
            type: string,
            enum: [success, failed, closed, unrecognized],
            description: 'NTS OCR 검증 결과 — 성공/실패/폐업·폐점/인식불가 (실패 계열은 빨간색 표기)',
          }
        status:
          {
            type: string,
            enum: [pending, approved, rejected],
            description: 심사 상태 — 대기(파랑)/승인(초록)/거부(빨강) 뱃지,
          }
    CertificateEntry:
      type: object
      description: 상장(자격/수상) 인증 항목 (CertificateRow)
      properties:
        id: { type: string, format: uuid }
        user: { type: string, description: 신청 사용자 이름 }
        award: { type: string, description: '상장 제목 (예: 2025 공공데이터 활용 대회 대상)' }
        category: { type: string, enum: [award, participation], description: 수상 실적 | 출품 이력 }
        fileId: { type: string, format: uuid, description: 상장 이미지 (썸네일/원본 오버레이) }
        status: { type: string, enum: [pending, verified, rejected], description: 미인증/인증/거부 }
    AdminTeamCard:
      type: object
      description: 콘텐츠 모니터링 '확인해야하는 팀' 카드 (AdminTeamCard)
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        challenge: { type: string, description: 소속 챌린지명 }
        members: { type: string, description: "'2/4명 참여중' 형태" }
        roles: { type: array, items: { type: string }, description: 모집 완료된 역할 뱃지 }
        otherRoles: { type: array, items: { type: string }, description: 모집 중인 역할 뱃지 }
        unread: { type: boolean, description: 미확인 도트 표시 여부 }
    AdminContestCard:
      type: object
      description: 콘텐츠 모니터링 '확인해야하는 챌린지' 카드 (AdminContestCard)
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        category: { type: string }
        dday: { type: string, description: "'D-7' 형태" }
        teams: { type: string, description: "'팀 모집 3건' 형태" }
        unread: { type: boolean }
    AdminUserEntry:
      type: object
      description: 사용자 관리 테이블 행 (UserRow) — 이메일 마스킹, 신고 누적 포함
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, description: 마스킹된 이메일 }
        position: { type: string, description: 포지션 (프론트엔드/백엔드/디자이너/기획 등) }
        reports: { type: integer, description: 신고 누적 건수 }
        status: { type: string, enum: [active, suspended], description: 활성/정지 뱃지 }
    AdminAdEntry:
      type: object
      description: 광고 관리 테이블 행 (AdminAdsScreen) — 광고 상세 + 기관명 + 상품명
      properties:
        id: { type: string, format: uuid }
        businessId: { type: string, format: uuid }
        productId: { type: string }
        title: { type: string, description: 광고명 (연결된 챌린지명) }
        imageFileId: { type: string, format: uuid }
        landingUrl: { type: string }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        status:
          {
            type: string,
            enum: [active, preparing, paused, ended],
            description: 진행중/준비중/중단됨/만료,
          }
        paidAmount: { type: integer, description: 결제 금액 (원) }
        organization: { type: string, description: 광고를 등록한 기관명 }
        productName: { type: string, description: '광고 상품(슬롯)명' }
    AdSlotPricing:
      type: object
      description: 광고비 관리 슬롯 항목 — 슬롯별 단가와 현재 광고 정보
      properties:
        slot: { type: string, enum: [hero, gallery, team] }
        dailyPrice: { type: integer, description: 일일 광고비 (원) }
        currentAdId: { type: string, format: uuid, nullable: true }
        organization: { type: string, nullable: true, description: '현재 광고사 (예: 부산광역시)' }
        period: { type: string, nullable: true, description: "노출 기간 (예: '8/24~9/24')" }
    AdminAdReport:
      type: object
      description: 빅배너 N번 광고 리포트 (AdReportData) — `?ad=N` 조회 시 반환
      properties:
        adNumber: { type: integer, description: 빅배너 번호 }
        organization: { type: string, description: 광고 기관 }
        period: { type: string }
        stats: { $ref: '#/components/schemas/AdminStatCardList' }
        daily:
          type: array
          description: 일별 노출·클릭 (AdReportChart — 노출 영역차트 + 클릭 라인, 이중 Y축)
          items: { $ref: '#/components/schemas/DailyMetric' }
    ActivityChart:
      type: object
      description: |
        활동 차트 (ActivityChart) — 월별 일반/기업 이중 영역차트 (recharts ComposedChart).
        months[i]와 general[i]/corp[i]가 인덱스로 대응.
      properties:
        months: { type: array, items: { type: string }, description: "월 라벨 (예: 'JAN'~'JUN')" }
        general: { type: array, items: { type: number }, description: 일반 사용자 활동 }
        corp: { type: array, items: { type: number }, description: 기업 사용자 활동 }
        yMax: { type: number, description: Y축 상한 (ticks는 0~yMax까지 2 간격으로 생성)' }
    AdminSettings:
      type: object
      description: 관리자 설정 (`/admin/settings`)
      properties:
        profile:
          type: object
          description: 관리자 계정 정보 카드
          properties:
            name: { type: string }
            role: { type: string, description: '역할 (예: Super Admin)' }
            email: { type: string, format: email }
            twoFactorEnabled: { type: boolean, description: 2단계 인증 사용 여부 }
        groups:
          type: array
          description: 설정 그룹 (서비스 설정/알림 설정)
          items:
            type: object
            properties:
              title: { type: string }
              rows:
                type: array
                items:
                  type: object
                  properties:
                    key: { type: string, description: '설정 키 (예: bizAutoApprove)' }
                    label: { type: string }
                    description: { type: string }
        values:
          type: object
          additionalProperties: { type: boolean }
          description: 현재 설정 값 (키 → on/off)
    AdminDashboard:
      type: object
      description: 관리자 대시보드(`/admin`) 위젯 데이터 묶음
      properties:
        stats: { $ref: '#/components/schemas/AdminStatCardList' }
        adRatio: { $ref: '#/components/schemas/AdRatioGauge' }
        traffic: { $ref: '#/components/schemas/TrafficSeries' }
        reports: { type: array, items: { $ref: '#/components/schemas/Report' } }
    Report:
      type: object
      description: 신고 로그 행 (ReportRow)
      properties:
        id: { type: string, format: uuid }
        content: { type: string, description: '신고 대상 콘텐츠명 (예: 2025 AI챌린지)' }
        targetType:
          {
            type: string,
            enum: [challenge, team, award, user],
            description: 챌린지/팀 모집/수상작/사용자 프로필,
          }
        org: { type: string, description: 소속 (기관명 또는 개인) }
        summary: { type: string, description: '신고 사유 요약 (예: 피싱 의심)' }
        detail: { type: string, description: 신고 상세 내용 }
        reporter: { type: string, description: '신고자 (마스킹, 예: 김*아)' }
        reportedAt: { type: string, format: date-time }
        status:
          {
            type: string,
            enum: [open, resolved, dismissed],
            description: '처리 상태 — 대기/승인(조치 완료)/거부(기각)',
          }
    CreateReportRequest:
      type: object
      description: 신고하기 폼(`/reports/new`) 제출 바디
      required: [targetType, summary]
      properties:
        targetType:
          {
            type: string,
            enum: [challenge, team, award, user],
            description: 신고 대상 종류 — 공모전/팀 모집글/수상작/사용자 프로필,
          }
        targetId: { type: string, format: uuid, description: '신고 대상 id (없으면 미상 대상)' }
        summary: { type: string, maxLength: 200, description: '신고 사유 (예: 비방)' }
        detail: { type: string, description: 자세한 신고 내용 }
        reportedUserId:
          { type: string, format: uuid, description: '피신고자 id (targetType=user일 때 사용)' }
        org: { type: string, maxLength: 200, description: 신고 대상의 소속(기관명 등) }
