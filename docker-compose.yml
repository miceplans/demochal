services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: semochal
      POSTGRES_PASSWORD: semochal
      POSTGRES_DB: semochal
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - semochal-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U semochal -d semochal']
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: server/Dockerfile.api
    command: ['node', 'dist/migrate.js']
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://semochal:semochal@db:5432/semochal
    depends_on:
      db:
        condition: service_healthy

  localstack:
    image: localstack/localstack:4
    environment:
      SERVICES: s3
    ports:
      - '127.0.0.1:4566:4566'
    healthcheck:
      test: ['CMD-SHELL', 'awslocal s3 ls >/dev/null 2>&1']
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: creates the dev buckets and browser-upload CORS on the LocalStack S3.
  # Idempotent so `docker compose up` can re-run it after a restart.
  s3-init:
    image: amazon/aws-cli:2.15.30
    depends_on:
      localstack:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: ap-northeast-2
    entrypoint: /bin/sh
    command:
      - -c
      - |
        aws --endpoint-url http://localstack:4566 s3 mb s3://semochal-private-dev || true
        aws --endpoint-url http://localstack:4566 s3 mb s3://semochal-public-dev || true
        printf '%s\n' '{"CORSRules":[{"AllowedOrigins":["http://localhost:3000"],"AllowedMethods":["PUT","GET","HEAD"],"AllowedHeaders":["*"],"ExposeHeaders":["ETag"],"MaxAgeSeconds":300}]}' > /tmp/cors.json
        aws --endpoint-url http://localstack:4566 s3api put-bucket-cors --bucket semochal-private-dev --cors-configuration file:///tmp/cors.json
        aws --endpoint-url http://localstack:4566 s3api put-bucket-cors --bucket semochal-public-dev --cors-configuration file:///tmp/cors.json

  api:
    build:
      context: .
      dockerfile: server/Dockerfile.api
    environment:
      NODE_ENV: development
      PORT: '3001'
      DATABASE_URL: postgres://semochal:semochal@db:5432/semochal
    ports:
      - '3001:3001'
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3001/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  semochal-db-data:
