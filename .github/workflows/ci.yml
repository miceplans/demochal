name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Jobs only need to read the repository. Deployment credentials are deliberately
# kept out of this workflow.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Run server unit tests
        run: pnpm --filter @semochal/server test

      - name: Build workspaces
        run: pnpm build

      - name: Build API image
        run: docker build --file server/Dockerfile.api --tag semochal-api:ci .

      - name: Build worker image
        run: docker build --file server/Dockerfile.worker --tag semochal-worker:ci .
