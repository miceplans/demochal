name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

# Jobs only need to read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4
        with:
          version: 12.3.4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20.x
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve format base
        id: format-base
        # pull_request에서는 base 브랜치, main push에는 푸시 이전 SHA를 base로 쓴다.
        # base_ref는 pull_request 이벤트에서만 존재하므로 push에서는 비어 있다.
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "base=origin/${{ github.base_ref }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            echo "base=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          else
            echo "base=HEAD~1" >> "$GITHUB_OUTPUT"
          fi

      - name: Check formatting
        # Keep this gate aligned with the PR formatting job: baseline files are
        # tolerated, while files changed by this PR must be formatted.
        run: node scripts/format-check.mjs --base "${{ steps.format-base.outputs.base }}"

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Run server unit tests
        run: pnpm --filter @semochal/server test:cov

      - name: Run api-client unit tests
        run: pnpm --filter @semochal/api-client test

      - name: Build workspaces
        run: pnpm build
        env:
          # CI 검증 빌드용 기본값. 로컬 개발과 동일하게 백엔드 오리진 없이 빌드되도록 한다(프론트 next.config의 fail-closed 검증).
          API_PROXY_TARGET: http://localhost:3001

      - name: Build API image
        run: docker build --file server/Dockerfile.api --tag semochal-api:ci .

      - name: Build worker image
        run: docker build --file server/Dockerfile.worker --tag semochal-worker:ci .

  # jsdom 30(front 테스트 환경)이 요구하는 Node 22+에서만 프론트 테스트를 돌린다(pr-validation의
  # front-tests 잡과 동일). 앱 런타임은 jsdom을 로드하지 않아 Node 20 기준과 무관하다.
  front-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # front 테스트는 api-client의 dist를 import하므로 먼저 빌드한다.
      - run: pnpm --filter @semochal/api-client build
      - run: pnpm --filter @semochal/front test

  # Same gates as pr-validation.yml: a direct push to main must not bypass the
  # credential scan or the production dependency audit.
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Scan pushed commits for credentials
        run: |
          base="${{ github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="HEAD~1"
          fi
          node scripts/secret-scan.mjs --base "$base"

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # High and critical production dependency vulnerabilities block the gate.
      - run: pnpm audit --prod --audit-level high
