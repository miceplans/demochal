name: PR AI orchestration

on:
  pull_request:
    # risk 분석은 PR 생성/재오픈 시 1회만 실행한다(synchronize 제거 — 토큰 절감).
    types: [opened, reopened]
  pull_request_review_comment:
    types: [created]
  issue_comment:
    types: [created]
  workflow_run:
    workflows: [PR validation]
    types: [completed]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  risk-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: ai-pr-risk-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Resolve immutable PR base SHA
        id: pr-base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base_sha="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${{ github.event.pull_request.number }}" --jq '.base.sha')"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
      - name: Restore trusted base-commit dispatch script
        env:
          BASE_SHA: ${{ steps.pr-base.outputs.base_sha }}
        run: |
          git fetch origin "$BASE_SHA" --depth=1
          git checkout "$BASE_SHA" -- scripts/ai-dispatch.mjs
      - name: Dispatch PR risk analysis to the trusted AI runner
        run: node scripts/ai-dispatch.mjs pr-risk
        env:
          AI_AUTOMATION_WEBHOOK_URL: ${{ secrets.AI_AUTOMATION_WEBHOOK_URL }}
          AI_AUTOMATION_WEBHOOK_TOKEN: ${{ secrets.AI_AUTOMATION_WEBHOOK_TOKEN }}

  ci-repair:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: ai-ci-repair-${{ github.event.workflow_run.id }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Restore trusted default-branch dispatch script
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch origin "$DEFAULT_BRANCH" --depth=1
          git checkout "origin/$DEFAULT_BRANCH" -- scripts/ai-dispatch.mjs
      - name: Dispatch failed validation to the trusted AI runner
        run: node scripts/ai-dispatch.mjs ci-repair
        env:
          AI_AUTOMATION_WEBHOOK_URL: ${{ secrets.AI_AUTOMATION_WEBHOOK_URL }}
          AI_AUTOMATION_WEBHOOK_TOKEN: ${{ secrets.AI_AUTOMATION_WEBHOOK_TOKEN }}

  review-comment:
    if: >-
      (github.event_name == 'pull_request_review_comment' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request)) &&
      !contains(github.event.comment.body, '<!-- ai-automation-reply -->')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: ai-pr-comment-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: false
    steps:
      - name: Dispatch comment to the trusted AI runner
        env:
          GH_TOKEN: ${{ github.token }}
          AI_AUTOMATION_WEBHOOK_URL: ${{ secrets.AI_AUTOMATION_WEBHOOK_URL }}
          AI_AUTOMATION_WEBHOOK_TOKEN: ${{ secrets.AI_AUTOMATION_WEBHOOK_TOKEN }}
        run: |
          if [[ -z "$AI_AUTOMATION_WEBHOOK_URL" || -z "$AI_AUTOMATION_WEBHOOK_TOKEN" ]]; then
            echo "AI dispatch skipped: webhook secrets are not configured."
            exit 0
          fi

          event="$(cat "$GITHUB_EVENT_PATH")"
          pr_number="$(jq -r '.pull_request.number // .issue.number' <<<"$event")"
          comment_id="$(jq -r '.comment.id' <<<"$event")"
          payload="$(jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg event_name "$GITHUB_EVENT_NAME" \
            --arg delivery "$GITHUB_RUN_ID" \
            --arg pr_number "$pr_number" \
            --arg comment_id "$comment_id" '
              {
                mode: "pr-review-comment",
                repository: $repository,
                eventName: $event_name,
                delivery: $delivery,
                pullRequest: { number: ($pr_number | tonumber) },
                reviewComment: {
                  id: ($comment_id | tonumber),
                  sessionKey: ( $repository + ":pr:" + $pr_number ),
                  idempotencyKey: ( $repository + ":pr-comment:" + $comment_id )
                }
              }
            ')
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header 'content-type: application/json' \
            --header "authorization: Bearer ${AI_AUTOMATION_WEBHOOK_TOKEN}" \
            --data "$payload" \
            "$AI_AUTOMATION_WEBHOOK_URL"
          echo "AI dispatch (pr-review-comment) accepted."
