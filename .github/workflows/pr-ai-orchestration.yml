name: PR AI orchestration

on:
  pull_request:
    # risk 분석은 PR 생성/재오픈 시 1회만 실행한다(synchronize 제거 — 토큰 절감).
    types: [opened, reopened]
  workflow_run:
    workflows: [PR validation]
    types: [completed]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  risk-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: ai-pr-risk-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      # Trust boundary: PR authors can rewrite scripts/, but the webhook token
      # below must only ever be handled by the base-branch revision of
      # ai-dispatch.mjs. The PR checkout stays available for reading the diff;
      # the executed script is reset to the trusted base revision, and the PR
      # metadata it sends comes from the GitHub event payload, never PR code.
      - name: Restore trusted base-branch scripts
        run: git checkout "origin/${{ github.base_ref }}" -- scripts/
      - name: Dispatch PR risk analysis to the trusted AI runner
        run: node scripts/ai-dispatch.mjs pr-risk
        env:
          AI_AUTOMATION_WEBHOOK_URL: ${{ secrets.AI_AUTOMATION_WEBHOOK_URL }}
          AI_AUTOMATION_WEBHOOK_TOKEN: ${{ secrets.AI_AUTOMATION_WEBHOOK_TOKEN }}

  ci-repair:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: ai-ci-repair-${{ github.event.workflow_run.id }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Dispatch failed validation to the trusted AI runner
        run: node scripts/ai-dispatch.mjs ci-repair
        env:
          AI_AUTOMATION_WEBHOOK_URL: ${{ secrets.AI_AUTOMATION_WEBHOOK_URL }}
          AI_AUTOMATION_WEBHOOK_TOKEN: ${{ secrets.AI_AUTOMATION_WEBHOOK_TOKEN }}
