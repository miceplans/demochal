name: Qodo Merge (PR-Agent)

# 2026-09-30 자동 실행 비활성화: OPENAI_KEY secret이 없어 매 실행 실패
# ("Failed to generate code suggestions for PR" 댓글만 쌓임).
# 키를 등록한 뒤 아래 트리거를 복원하거나, Actions 탭에서 수동 실행하세요.
on:
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write
  contents: write

jobs:
  pr_agent_job:
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    steps:
      - name: Run Qodo Merge (PR-Agent)
        uses: the-pr-agent/pr-agent@f3b385ea2927247ddcff2fe252472380b9c8f5fc # v0.45.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
          # 다른 모델을 쓰려면 위 대신 아래 중 하나를 사용하세요.
          # ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_KEY }}
          # GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          GITHUB_ACTION_CONFIG.AUTO_DESCRIBE: true
          GITHUB_ACTION_CONFIG.AUTO_REVIEW: true
          GITHUB_ACTION_CONFIG.AUTO_IMPROVE: true
