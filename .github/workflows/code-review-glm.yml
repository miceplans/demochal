name: Code Review (GLM)

on:
  pull_request:
    types: [opened, ready_for_review, reopened]
    # 문서 전용 변경은 AI 리뷰를 실행하지 않는다(토큰 절감).
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/**/*.md'
      - '**/pnpm-lock.yaml'
      - '**/package-lock.json'
      - '**/yarn.lock'
      - 'packages/api-client/src/generated/**'

jobs:
  # Z.AI 계정 잔액이 없으면 review job을 실행하지 않고 CI에서 Skipped로 표시한다.
  # probe는 glm-4.5-air로 1토큰 요청을 본 뒤 잔액 부족 응답인지만 확인한다.
  check-quota:
    name: Check GLM balance
    runs-on: ubuntu-latest
    environment: ZAI_API_KEY
    outputs:
      skip_review: ${{ steps.probe.outputs.skip_review }}
    steps:
      - name: Probe Z.AI balance
        id: probe
        env:
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
        run: |
          response=$(curl -sS -o /tmp/zai-probe.json -w '%{http_code}' \
            -X POST 'https://api.z.ai/api/anthropic/v1/messages' \
            -H "x-api-key: $ZAI_API_KEY" \
            -H 'anthropic-version: 2023-06-01' \
            -H 'content-type: application/json' \
            --max-time 60 \
            -d '{"model":"glm-4.5-air","max_tokens":1,"messages":[{"role":"user","content":"ping"}]}' \
            || echo '000')
          echo "probe HTTP status: $response"
          if [ "$response" = '200' ]; then
            echo 'skip_review=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          body=$(head -c 2000 /tmp/zai-probe.json 2>/dev/null || true)
          echo "$body"
          if [ "$response" = '402' ] || echo "$body" | grep -qiE 'insufficient[ _-]?balance|insufficient_quota|balance[ _-]?(exhausted|depleted)|limit exhausted|weekly/monthly limit|"code": ?"1310"|payment_required|잔액[^0-9a-z]*부족|余额不足'; then
            echo 'Z.AI 잔액 부족 — review job을 실행하지 않습니다.'
            echo 'skip_review=true' >> "$GITHUB_OUTPUT"
          else
            echo 'skip_review=false' >> "$GITHUB_OUTPUT"
          fi

  classify-review:
    name: Classify GLM review depth
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      review_model: ${{ steps.classify.outputs.review_model }}
      review_tier: ${{ steps.classify.outputs.review_tier }}
    steps:
      - name: Select review model from PR risk and size
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
          CHANGED_LINES: ${{ github.event.pull_request.additions + github.event.pull_request.deletions }}
        run: |
          files="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename')"
          deep_review=false

          # Large diffs and sensitive paths need the stronger model. Keep this list conservative:
          # it covers auth/authorization, payment, private files/OCR, runtime config, and deployment.
          if (( CHANGED_FILES > 15 || CHANGED_LINES > 600 )) || \
            grep -Eq '^(server/src/modules/(auth|files|payments)/|server/src/config/|front/src/(app|components|features)/(auth|payments)/|infra/|\.github/workflows/|server/Dockerfile|server/docs/openapi\.yaml)' <<< "$files"; then
            deep_review=true
          fi

          if [ "$deep_review" = true ]; then
            echo 'review_model=glm-4.7' >> "$GITHUB_OUTPUT"
            echo 'review_tier=deep' >> "$GITHUB_OUTPUT"
          else
            echo 'review_model=glm-4.5-air' >> "$GITHUB_OUTPUT"
            echo 'review_tier=standard' >> "$GITHUB_OUTPUT"
          fi

  review:
    needs: [check-quota, classify-review]
    if: needs.check-quota.outputs.skip_review != 'true'
    runs-on: ubuntu-latest
    environment: ZAI_API_KEY
    # 같은 PR의 리뷰 실행이 쌓이면 이전 실행을 취소한다(토큰 낭비 방지).
    concurrency:
      group: glm-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      id-token: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1

      # 잔액/한도 소진 등으로 리뷰 실행이 실패핰도 CI를 빨간불로 만들지 않고 스킵한다(실패 사유는 아래 warning step이 기록).
      - uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1
        id: glm-review
        continue-on-error: true
        env:
          # Z.AI의 Anthropic 호환 엔드포인트로 우회.
          # 중국 본토에서 발급받은 키라면 https://open.bigmodel.cn/api/anthropic 사용
          ANTHROPIC_BASE_URL: 'https://api.z.ai/api/anthropic'
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ZAI_API_KEY }}
          ANTHROPIC_DEFAULT_SONNET_MODEL: ${{ needs.classify-review.outputs.review_model }}
          ANTHROPIC_DEFAULT_OPUS_MODEL: ${{ needs.classify-review.outputs.review_model }}
          ANTHROPIC_DEFAULT_HAIKU_MODEL: 'glm-4.5-air'
          API_TIMEOUT_MS: '3000000'
        with:
          # 이 입력값 자체는 GLM 사용 시 무시되지만, 액션이 값 존재를 요구하므로 채워둠
          anthropic_api_key: ${{ secrets.ZAI_API_KEY }}
          prompt: |
            이 PR(${{ github.repository }}/pull/${{ github.event.pull_request.number }})을 리뷰해줘.
            현재 리뷰 등급은 `${{ needs.classify-review.outputs.review_tier }}`이며,
            먼저 PR의 변경 파일 목록과 diff만 검토해줘. 변경과 직접 연결된 코드 또는
            CLAUDE.md의 관련 규칙이 필요할 때만 최소 범위로 추가 파일을 열고, 전체 레포를
            탐색하지 마. /repo 루트의 CLAUDE.md에서 변경 경로에 관련된 프로젝트 컨벤션과
            아키텍처 규칙을 적용해줘.

            우선순위:
            1. CLAUDE.md에 명시된 아키텍처 규칙 위반 (Outbox 패턴, Zustand/TanStack Query 경계,
               Dockerfile 분기 등)
            2. 결제(Toss Payments)·개인정보(CLOVA OCR)·청소년 보호 관련 코드의 보안/정책 이슈
            3. 일반적인 버그, 예외 처리 누락, 타입 안정성 문제

            사소한 스타일 의견은 최소화하고, 위 우선순위에 해당하는 이슈만 인라인 코멘트로 남겨줘.
            인라인 지적 여부와 관계없이 검토를 마친 뒤 `gh pr comment`로 PR 일반 코멘트를 정확히 한 건 남겨줘.
            문제가 없으면 "문제 없음"과 검토 범위를, 문제가 있으면 인라인 지적의 요약과 확인 요청을 적어줘.
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*)"'

      - name: Warn when GLM review fails
        if: steps.glm-review.outcome == 'failure'
        run: |
          echo '::warning::GLM 코드 리뷰가 실패해 스킵합니다. 대부분 Z.AI 잔액 부족 또는 glm-4.7 모델 한도 소진이 원인입니다. 위 Claude execution 로그(claude-execution-output.json)를 확인하세요.'
