name: PR validation

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  formatting:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The repository has no baseline format gate yet; check only this PR's files.
      - run: node scripts/format-check.mjs --base "origin/${{ github.base_ref }}"

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Existing server coverage tooling is used without imposing a new global threshold.
      - run: pnpm --filter @semochal/server test:cov
      # api-client regression tests (orval envelope contract) — added in #91.
      - run: pnpm --filter @semochal/api-client test

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @semochal/api-client build
      - run: pnpm --filter @semochal/front build
      - run: pnpm --filter @semochal/server build

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: node scripts/secret-scan.mjs --base "origin/${{ github.base_ref }}"

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # High and critical production dependency vulnerabilities block the gate.
      - run: pnpm audit --prod --audit-level high

  quality-gate:
    if: always()
    needs: [lint, formatting, typecheck, tests, build, secret-scan, dependency-audit]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report deterministic quality gate result
        env:
          LINT: ${{ needs.lint.result }}
          FORMATTING: ${{ needs.formatting.result }}
          TYPECHECK: ${{ needs.typecheck.result }}
          TESTS: ${{ needs.tests.result }}
          BUILD: ${{ needs.build.result }}
          SECRET_SCAN: ${{ needs.secret-scan.result }}
          DEPENDENCY_AUDIT: ${{ needs.dependency-audit.result }}
        run: |
          printf 'lint: %s\nformatting: %s\ntypecheck: %s\ntests: %s\nbuild: %s\nsecret-scan: %s\ndependency-audit: %s\n' \
            "$LINT" "$FORMATTING" "$TYPECHECK" "$TESTS" "$BUILD" "$SECRET_SCAN" "$DEPENDENCY_AUDIT"
          test "$LINT" = success
          test "$FORMATTING" = success
          test "$TYPECHECK" = success
          test "$TESTS" = success
          test "$BUILD" = success
          test "$SECRET_SCAN" = success
          test "$DEPENDENCY_AUDIT" = success
          echo QUALITY_GATE_PASS
